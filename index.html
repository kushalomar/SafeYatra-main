<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeYatra AI</title>
    <script>
        // Check if user is logged in
        var loggedMobile = localStorage.getItem('safeyatra_logged_mobile');
        if (loggedMobile && loggedMobile.trim() !== "") {
            window.location.href = "frontend/html/index.html";
        } else {
            window.location.href = "frontend/html/login.html";
        }
    </script>
</head>
<body>
    <p>Redirecting to <a href="frontend/html/login.html">SafeYatra AI</a>...</p>
</body>
</html>
