<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="../css/map.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://kit.fontawesome.com/4636c07b63.js"></script>

    <!-- map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>
    <div class="map-container">

        <div id="map"></div>

        <div class="search-bar">
            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="Search destination...">
                <button type="submit">
                    <i class="fa-solid fa-magnifying-glass fa-lg"></i>
                </button>
            </form>
            <div id="searchResults" class="search-results" style="display: none;"></div>
        </div>

        <!-- Emergency Info Card Overlay -->
        <div id="emergencyCard" class="emergency-card" style="display: none;">
            <div class="emergency-card-header">
                <span id="emergencyCardTitle">🚔 Nearest Police Station</span>
                <button id="closeEmergencyCardBtn" class="close-card-btn">&times;</button>
            </div>
            <div class="emergency-card-body">
                <h4 id="emergencyStationName">Searching...</h4>
                <p id="emergencyDistanceText">Calculating distance...</p>
                <button id="emergencyNavigateBtn" class="emergency-nav-btn">
                    <i class="fa-solid fa-location-arrow"></i> Navigate
                </button>
            </div>
        </div>

    </div>
    <button class="floating-btn">
        <i class="fa-solid fa-location-dot"></i>
    </button>

    <!-- footer -->

    <footer>
        <nav class="bottom-nav">

            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house "></i>
                <span>Home</span>
            </a>

            <a href="map.html" class="nav-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Map</span>
            </a>

            <a href="alerts.html" class="nav-item">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Alerts</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </footer>
</body>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../../backend/maps.js"></script>

</html>
